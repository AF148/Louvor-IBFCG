<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Documento base do Ionic; o Angular monta a aplicação dentro de app-root. -->
  <meta charset="utf-8" />
  <title>Louvor-IBFCG</title>

  <base href="/" />

  <meta name="color-scheme" content="light dark" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <!-- Logo oficial da igreja (assets/img/logo_IBFCG.png). -->
  <link rel="icon" type="image/png" href="assets/icon/favicon.png" />
  <link rel="apple-touch-icon" href="assets/icon/favicon.png" />
  <meta name="theme-color" content="#ffffff" />

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />

  <!-- Aplica o tema salvo antes do app carregar (evita "flash" de cor). -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('scale-tema');
        var dark =
          t === 'escuro' ||
          (t !== 'claro' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) {
          document.documentElement.classList.add('ion-palette-dark');
        }
      } catch (e) {}
    })();
  </script>
  <script>
    window.fumsData = window.fumsData || [];
    window.fums = window.fums || function () { window.fumsData.push(arguments); };
  </script>
  <script type="text/javascript" src="https://pkg.api.bible/fumsV3.min.js"></script>
</head>

<body>
  <app-root></app-root>
</body>

</html>
